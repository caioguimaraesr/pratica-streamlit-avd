# Identidade visual do app. O tema pode ser trocado pelo menu ⋮ → Settings → Choose app theme.
# Azul-aço como cor de destaque: não compete com o laranja/vermelho que os
# gráficos de distribuição já usam para "Aceitável"/"Não Aceitável".

[theme]
paddingTop = "0.5rem"     # espaço abaixo da barra do topo
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#2f6690"            # cor de destaque (widgets, links)
backgroundColor = "#ffffff"         # fundo da página
secondaryBackgroundColor = "#eef2f6"  # fundo da sidebar e de widgets
textColor = "#1f2a33"               # cor do texto
borderColor = "#d7dee5"

[theme.dark]
primaryColor = "#5fa8d3"
backgroundColor = "#11161b"
secondaryBackgroundColor = "#1b232b"
textColor = "#e8edf2"
borderColor = "#2d3942"
